<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị VTC Pay - Quản Lý SMS</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tải React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Tải Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --vtc-blue: #0068ac;
            --vtc-blue-dark: #005691;
            --header-bg: #f8f9fa;
            --table-header-bg: #e9ecef;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Open Sans", sans-serif;
            background-color: #fff;
            font-size: 13px;
            margin: 0;
            padding: 0;
        }

        /* --- Top Navbar --- */
        .top-nav {
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            padding: 10px 15px;
            color: #333;
            position: relative;
            z-index: 1000;
        }

        .logo-text {
            font-weight: 800;
            font-size: 24px;
            color: var(--vtc-blue);
            font-style: italic;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-btn {
            background-color: var(--vtc-blue);
            color: white;
            border: none;
            border-radius: 3px;
            padding: 6px 12px;
            margin: 2px;
            font-size: 13px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }
        
        .nav-btn:hover {
            background-color: var(--vtc-blue-dark);
            color: white;
        }

        .nav-btn.active-tab {
            background-color: var(--vtc-blue-dark);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .nav-dropdown .dropdown-toggle::after {
            margin-left: 0.5em;
        }
        .nav-dropdown .dropdown-menu {
            font-size: 13px;
            border-radius: 0;
            margin-top: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        .nav-dropdown .dropdown-item:active, .nav-dropdown .dropdown-item.active {
            background-color: var(--vtc-blue);
        }
        .nav-dropdown .dropdown-item {
            padding: 8px 15px;
            cursor: pointer;
            text-decoration: none;
            color: #212529;
        }
        .nav-dropdown .dropdown-item:hover {
            background-color: #f8f9fa;
        }

        .user-info {
            color: var(--vtc-blue);
            font-weight: 500;
            white-space: nowrap;
        }
        
        .logout-btn {
            color: #dc3545 !important;
            transition: opacity 0.2s;
        }
        .logout-btn:hover {
            opacity: 0.7;
        }

        /* --- Page Content --- */
        .page-title-bar {
            background-color: #337ab7;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-left: 5px solid #1b5480;
            font-size: 14px;
        }

        .filter-section {
            padding: 0 15px;
            margin-bottom: 20px;
            background-color: #fff;
        }

        .filter-content-wrapper {
            background-color: #f8f9fa;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .filter-label {
            font-weight: 600;
            color: #0068ac;
            display: flex;
            align-items: center;
            font-size: 13px;
            padding-top: 6px;
            white-space: nowrap;
        }

        .form-control, .form-select {
            font-size: 13px;
            border-radius: 3px;
            padding: 5px 8px;
        }

        .btn-search {
            background-color: #5bc0de;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 3px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-search:hover { background-color: #46b8da; color: white; }

        .btn-add {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 3px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-add:hover { background-color: #4cae4c; color: white; }

        .action-toolbar {
            padding: 10px 15px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .toolbar-btn {
            font-size: 12px;
            margin-right: 5px;
            background-color: #fff;
            border: 1px solid #ccc;
            color: #333;
            margin-bottom: 5px;
            padding: 4px 8px;
        }
        .toolbar-btn:hover { background-color: #e2e6ea; }

        /* --- Table --- */
        .table {
            font-size: 12px;
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
        }
        .table th, .table td {
            vertical-align: middle;
            padding: 8px;
            border-bottom: 1px solid #dee2e6;
        }
        .table thead th {
            background-color: #dff0d8; /* Light green header matching index */
            vertical-align: middle;
            text-align: center;
            border-bottom: 2px solid #aeccae;
            border-top: 1px solid #dee2e6;
            color: #333;
            font-weight: bold;
        }
        .table-responsive-custom {
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            color: white;
        }
        .status-active { background-color: #28a745; }
        .status-inactive { background-color: #6c757d; }

        .action-btn-group button {
            margin: 0 2px;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 3px;
            border: none;
            color: white;
            transition: opacity 0.2s;
        }
        .action-btn-group button:hover { opacity: 0.85; }
        .btn-edit { background-color: #f0ad4e; }
        .btn-delete { background-color: #d9534f; }

        .footer-pagination {
            padding: 15px;
            background-color: #f8f9fa;
            border-top: 1px solid #ddd;
            font-size: 12px;
        }

        /* --- Tabs & Form --- */
        .nav-tabs-custom {
            border-bottom: 1px solid #ddd;
            padding: 0 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 2px;
        }
        .tab-btn {
            background-color: #e7e7e7;
            border: 1px solid #ddd;
            border-bottom: none;
            padding: 8px 15px;
            font-weight: bold;
            color: #666;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: #337ab7;
            color: white;
            border-color: #337ab7;
        }
        .tab-btn:not(.active):hover {
            background-color: #d4d4d4;
        }

        .form-container {
            padding: 0 15px;
        }
        .form-panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 1px 1px rgba(0,0,0,.05);
        }
        .form-panel-heading {
            background-color: #337ab7;
            color: #fff;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 3px 3px 0 0;
        }
        .form-panel-body {
            padding: 15px;
        }
        .form-group-row {
            display: flex;
            margin-bottom: 15px;
            align-items: center;
        }
        .form-group-label {
            width: 150px;
            text-align: right;
            padding-right: 15px;
            font-weight: bold;
            color: #333;
        }
        .form-group-content {
            flex: 1;
        }
        .required-star { color: red; margin-left: 3px; }

        .checkbox-grid {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 3px;
            background: #fff;
        }
        .checkbox-item {
            display: inline-flex;
            align-items: center;
            margin-right: 15px;
            margin-bottom: 5px;
            cursor: pointer;
        }
        .checkbox-item input { margin-right: 5px; }

        .sms-editor-container {
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .sms-editor-toolbar {
            background-color: #f5f5f5;
            border-bottom: 1px solid #ccc;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
        }
        .var-btn {
            background: #fff;
            border: 1px solid #ccc;
            color: #337ab7;
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
        }
        .var-btn:hover { background: #e6f0f9; border-color: #b3d4f0; }
        
        .sms-textarea {
            width: 100%;
            height: 150px;
            border: none;
            padding: 10px;
            resize: vertical;
            font-family: monospace;
            font-size: 13px;
            background-color: #fff;
        }
        .sms-textarea:focus {
            outline: none;
            background-color: #ffffe0;
        }
        .sms-stats-bar {
            background-color: #f9f9f9;
            border-top: 1px solid #ccc;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
        }

        .form-actions {
            background-color: #f5f5f5;
            padding: 15px;
            border-top: 1px solid #ddd;
            text-align: center;
        }
        .btn-save { background-color: #337ab7; color: white; border: none; padding: 6px 20px; font-weight: bold; border-radius: 3px; margin-right: 10px; }
        .btn-save:hover { background-color: #286090; }
        .btn-back { background-color: #fff; color: #333; border: 1px solid #ccc; padding: 6px 20px; font-weight: bold; border-radius: 3px; }
        .btn-back:hover { background-color: #e6e6e6; }

        .alert-info-custom {
            background-color: #f2dede;
            color: #a94442;
            border: 1px solid #ebccd1;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 3px;
            font-size: 13px;
        }
        .alert-badge {
            background-color: #d9534f;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 5px;
        }

        /* Responsive Adjustments */
        @media (max-width: 992px) {
            .top-nav { flex-direction: column; align-items: flex-start !important; gap: 10px; }
            .nav-menu-container { width: 100%; display: flex; flex-wrap: nowrap !important; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
            .user-info-container { width: 100%; justify-content: space-between; margin-top: 5px; border-top: 1px solid #eee; padding-top: 5px;}
            .form-group-row { flex-direction: column; align-items: flex-start; }
            .form-group-label { width: 100%; text-align: left; margin-bottom: 5px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- MOCK DATA & CONSTANTS ---
        const INITIAL_DATA = [
          { id: 112, name: '[VTC Pay] Mã xác thực OTP đăng ký', event: ['OTP_REGISTER'], status: 'Active', updatedBy: 'linhtt3', content: 'Ma xac thuc cua ban tai {BRANDNAME} la {OTP_CODE}. Vui long khong cung cap ma nay cho bat ky ai.' },
          { id: 152, name: '[VTC Pay] Cảnh báo biến động số dư', event: ['BALANCE_CHANGE'], status: 'Active', updatedBy: 'tuanhd', content: 'Tai khoan {ACCOUNT_NAME} vua phat sinh giao dich {AMOUNT} VND vao luc {TIME}. Kiem tra tai app VTC Pay.' },
          { id: 1524, name: '[VTC] Thông báo nhận quà khuyến mãi', event: ['PROMO_GIFT'], status: 'Inactive', updatedBy: 'nhatnd', content: 'Chuc mung {ACCOUNT_NAME} da nhan duoc qua tang tu {BRANDNAME}.' },
        ];

        const INITIAL_SMS_EVENTS = [
          { value: 'OTP_REGISTER', label: 'OTP Đăng ký/Đăng nhập' },
          { value: 'OTP_TRANSACTION', label: 'OTP Xác thực giao dịch' },
          { value: 'BALANCE_CHANGE', label: 'Biến động số dư' },
          { value: 'PROMO_GIFT', label: 'Thông báo Khuyến mãi' },
          { value: 'CSKH', label: 'Chăm sóc khách hàng' },
        ];

        const VARIABLES = [
          { tag: '{BRANDNAME}', name: 'Brandname', maxLength: 11, desc: 'Tên định danh (Tối đa 11 ký tự)' },
          { tag: '{OTP_CODE}', name: 'Mã OTP', maxLength: 6, desc: 'Mã xác thực (6 ký tự)' },
          { tag: '{ACCOUNT_NAME}', name: 'Tên tài khoản', maxLength: 25, desc: 'Tên khách hàng (Giả định max 25 ký tự)' },
          { tag: '{AMOUNT}', name: 'Số tiền', maxLength: 15, desc: 'Số tiền giao dịch (VD: 10,000,000)' },
          { tag: '{TIME}', name: 'Thời gian', maxLength: 19, desc: 'Định dạng DD/MM/YYYY HH:mm' },
        ];

        // --- HELPER FUNCTION: Tính toán độ dài tin nhắn ---
        const calculateSmsStats = (text) => {
          let processedText = text;
          
          VARIABLES.forEach(v => {
            const safePlaceholder = 'X'.repeat(v.maxLength);
            processedText = processedText.split(v.tag).join(safePlaceholder);
          });

          const isUnicode = /[^\u0000-\u00ff]/.test(processedText);
          const length = processedText.length;

          let maxSingle = isUnicode ? 70 : 160;
          let maxMulti = isUnicode ? 67 : 153;
          let parts = 0;

          if (length > 0) {
            if (length <= maxSingle) {
              parts = 1;
            } else {
              parts = Math.ceil(length / maxMulti);
            }
          }

          return { length, parts, isUnicode };
        };

        // --- COMPONENT CHÍNH ---
        function App() {
          const [view, setView] = useState('list');
          const [data, setData] = useState(INITIAL_DATA);
          const [smsEvents, setSmsEvents] = useState(INITIAL_SMS_EVENTS);
          const [formData, setFormData] = useState({});
          const [newEventName, setNewEventName] = useState('');
          const textAreaRef = useRef(null);

          const [searchTerm, setSearchTerm] = useState('');
          const [statusFilter, setStatusFilter] = useState('All');

          const goToList = () => setView('list');
          const goToCreate = () => {
            setFormData({ status: 'Active', event: [], content: '' });
            setView('form');
          };
          const goToEdit = (item) => {
            setFormData({ ...item });
            setView('form');
          };

          const handleSave = () => {
            if (!formData.name || !formData.content) {
              alert("Vui lòng điền các trường bắt buộc (*)");
              return;
            }
            
            if (formData.id) {
              setData(data.map(item => item.id === formData.id ? { ...formData, updatedBy: 'hongtt' } : item));
            } else {
              const newId = Math.floor(Math.random() * 100000);
              setData([{ ...formData, id: newId, updatedBy: 'hongtt' }, ...data]);
            }
            goToList();
          };

          const handleAddEvent = (e) => {
            e.preventDefault();
            if (!newEventName.trim()) return;
            
            const newValue = newEventName.trim().toUpperCase()
              .replace(/Đ/g, 'D')
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/\s+/g, '_')
              .replace(/[^A-Z0-9_]/g, '');

            if (smsEvents.find(ev => ev.value === newValue)) {
               alert('Nghiệp vụ này đã tồn tại!');
               return;
            }

            const finalValue = newValue || `EVENT_${Date.now()}`;
            const newEvent = { value: finalValue, label: newEventName.trim() };
            
            setSmsEvents([...smsEvents, newEvent]);
            
            const currentEvents = formData.event || [];
            setFormData({...formData, event: [...currentEvents, finalValue]});
            setNewEventName('');
          };

          const insertVariable = (tag) => {
            const text = formData.content || '';
            const cursorPosition = textAreaRef.current?.selectionStart || text.length;
            
            const textBefore = text.substring(0, cursorPosition);
            const textAfter = text.substring(cursorPosition);
            
            const newContent = textBefore + tag + textAfter;
            setFormData({ ...formData, content: newContent });
            
            setTimeout(() => {
              if (textAreaRef.current) {
                textAreaRef.current.focus();
                const newPos = cursorPosition + tag.length;
                textAreaRef.current.setSelectionRange(newPos, newPos);
              }
            }, 0);
          };

          const renderList = () => {
            const filteredData = data.filter(item => {
              const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  item.content.toLowerCase().includes(searchTerm.toLowerCase());
              const matchStatus = statusFilter === 'All' || item.status === statusFilter;
              return matchSearch && matchStatus;
            });

            return (
              <div>
                <div className="filter-section">
                    <div className="filter-content-wrapper">
                        <div className="row align-items-center mb-2">
                            <div className="col-lg-1 col-md-12 mb-1"><label className="filter-label"><i className="fa-solid fa-filter"></i> Trạng thái</label></div>
                            <div className="col-lg-3 col-md-6 mb-2">
                                <select className="form-select" value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
                                    <option value="All">-- Tất cả --</option>
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                            <div className="col-lg-1 col-md-12 mb-1"><label className="filter-label"><i className="fa-solid fa-magnifying-glass"></i> Từ khóa</label></div>
                            <div className="col-lg-3 col-md-6 mb-2">
                                <input type="text" className="form-control" placeholder="Nhập tên, nội dung mẫu..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                            <div className="col-lg-4 col-md-12 mb-2 d-flex gap-2">
                                <button className="btn-search"><i className="fa-solid fa-magnifying-glass me-1"></i> Tra Cứu</button>
                                <button onClick={goToCreate} className="btn-add"><i className="fa-solid fa-plus me-1"></i> Thêm mới</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="d-flex justify-content-between align-items-center action-toolbar mx-3">
                    <div className="toolbar-left d-flex flex-wrap">
                        <button className="btn toolbar-btn"><i className="fa-solid fa-bars text-primary"></i> Hiện 25 dòng</button>
                        <button className="btn toolbar-btn"><i className="fa-solid fa-eye-slash text-primary"></i> Ẩn/hiện cột</button>
                    </div>
                    <div className="toolbar-right d-flex align-items-center">
                        <span className="me-2 fw-bold text-secondary" style={{fontSize: '12px', whiteSpace: 'nowrap'}}>Tìm nhanh:</span>
                        <input type="text" className="form-control form-control-sm" placeholder="Nhập từ khóa..." />
                    </div>
                </div>

                <div className="table-responsive-custom">
                  <table className="table table-bordered table-striped table-hover align-middle">
                    <thead>
                      <tr>
                        <th style={{width: '50px'}}>STT</th>
                        <th style={{width: '80px'}}>ID</th>
                        <th>Tên mẫu SMS</th>
                        <th>SMS Event</th>
                        <th style={{width: '100px'}}>Trạng thái</th>
                        <th style={{width: '120px'}}>Người Cập Nhật</th>
                        <th className="sticky-col-right" style={{width: '80px'}}>Chức Năng</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredData.map((item, index) => (
                        <tr key={item.id}>
                          <td className="text-center">{index + 1}</td>
                          <td className="text-center">{item.id}</td>
                          <td className="fw-bold text-primary" style={{cursor: 'pointer'}} onClick={() => goToEdit(item)}>
                            {item.name}
                          </td>
                          <td>
                            {(item.event || []).map(eVal => smsEvents.find(e => e.value === eVal)?.label || eVal).join(', ')}
                          </td>
                          <td className="text-center">
                            <span className={`status-badge ${item.status === 'Active' ? 'status-active' : 'status-inactive'}`}>
                              {item.status}
                            </span>
                          </td>
                          <td>{item.updatedBy}</td>
                          <td className="text-center sticky-col-right">
                            <div className="action-btn-group">
                                <button onClick={() => goToEdit(item)} className="btn-edit" title="Sửa"><i className="fa-solid fa-pen-to-square"></i></button>
                                <button className="btn-delete" title="Xóa"><i className="fa-solid fa-trash"></i></button>
                            </div>
                          </td>
                        </tr>
                      ))}
                      {filteredData.length === 0 && (
                        <tr>
                          <td colSpan="7" className="text-center text-muted py-4">Không tìm thấy dữ liệu.</td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

                <div className="d-flex justify-content-between align-items-center footer-pagination">
                    <div className="text-muted fw-bold">Hiển thị từ 1 tới {filteredData.length} của {filteredData.length} bản ghi</div>
                    <nav>
                        <ul className="pagination pagination-sm">
                            <li className="page-item disabled"><a className="page-link" href="#"><i className="fa-solid fa-angle-left"></i> Trước</a></li>
                            <li className="page-item active"><a className="page-link" href="#">1</a></li>
                            <li className="page-item disabled"><a className="page-link" href="#">Tiếp <i className="fa-solid fa-angle-right"></i></a></li>
                        </ul>
                    </nav>
                </div>
              </div>
            );
          };

          const renderForm = () => {
            const smsStats = calculateSmsStats(formData.content || '');

            return (
              <div className="form-container">
                <div className="alert-info-custom">
                    <span className="alert-badge">Chú ý!</span>
                    Hãy chắc chắn nhập vào đầy đủ thông tin tại các mục bắt buộc đánh dấu (*)
                </div>

                <div className="form-panel">
                    <div className="form-panel-heading">
                        <i className="fa-solid fa-gear me-2"></i> {formData.id ? 'CẬP NHẬT MẪU SMS' : 'THÊM MỚI MẪU SMS'}
                    </div>
                    <div className="form-panel-body">
                        
                        <div className="form-group-row">
                            <div className="form-group-label">
                                Tên mẫu SMS<span className="required-star">*</span>
                            </div>
                            <div className="form-group-content">
                                <input type="text" className="form-control" value={formData.name || ''} onChange={(e) => setFormData({...formData, name: e.target.value})} placeholder="VD: Nhắc nhở thanh toán hóa đơn..." />
                            </div>
                        </div>

                        <div className="form-group-row">
                            <div className="form-group-label">
                                SMS Event
                            </div>
                            <div className="form-group-content">
                                <div className="checkbox-grid">
                                    <div className="d-flex flex-wrap mb-2">
                                        {smsEvents.map(ev => (
                                            <label key={ev.value} className="checkbox-item">
                                                <input 
                                                    type="checkbox" 
                                                    checked={(formData.event || []).includes(ev.value)}
                                                    onChange={(e) => {
                                                        const currentEvents = formData.event || [];
                                                        if (e.target.checked) {
                                                            setFormData({...formData, event: [...currentEvents, ev.value]});
                                                        } else {
                                                            setFormData({...formData, event: currentEvents.filter(val => val !== ev.value)});
                                                        }
                                                    }}
                                                />
                                                {ev.label}
                                            </label>
                                        ))}
                                    </div>
                                    <div className="d-flex align-items-center gap-2 pt-2 border-top">
                                        <input type="text" className="form-control form-control-sm" style={{width: '250px'}} placeholder="Nhập tên nghiệp vụ mới..." value={newEventName} onChange={e => setNewEventName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') handleAddEvent(e); }} />
                                        <button onClick={handleAddEvent} className="btn btn-sm btn-success fw-bold"><i className="fa-solid fa-plus"></i> Thêm nghiệp vụ</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="form-group-row">
                            <div className="form-group-label">
                                Trạng thái
                            </div>
                            <div className="form-group-content">
                                <select className="form-select" style={{maxWidth: '150px'}} value={formData.status || 'Active'} onChange={(e) => setFormData({...formData, status: e.target.value})}>
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                        </div>

                        <div className="form-group-row" style={{alignItems: 'flex-start'}}>
                            <div className="form-group-label" style={{marginTop: '10px'}}>
                                Nội dung SMS<span className="required-star">*</span>
                            </div>
                            <div className="form-group-content">
                                <div className="sms-editor-container">
                                    <div className="sms-editor-toolbar">
                                        <span className="fw-bold me-2"><i className="fa-solid fa-link"></i> Chèn biến:</span>
                                        {VARIABLES.map(v => (
                                            <button key={v.tag} onClick={(e) => { e.preventDefault(); insertVariable(v.tag); }} className="var-btn" title={v.desc}>
                                                {v.tag}
                                            </button>
                                        ))}
                                    </div>
                                    <textarea 
                                        ref={textAreaRef}
                                        className="sms-textarea"
                                        value={formData.content || ''}
                                        onChange={(e) => setFormData({...formData, content: e.target.value})}
                                        placeholder="Nhập nội dung tin nhắn dạng chữ thuần túy (Plain text)..."
                                    ></textarea>
                                    <div className="sms-stats-bar">
                                        <div>
                                            Ký tự (Đã tính biến): <strong style={{color: smsStats.length > 0 ? '#0068ac' : 'inherit'}}>{smsStats.length}</strong> | 
                                            Số tin (Max): <strong style={{color: smsStats.parts > 1 ? 'red' : 'green'}}>{smsStats.parts}</strong>
                                        </div>
                                        <div>
                                            {smsStats.isUnicode ? (
                                                <span style={{color: '#8a6d3b', fontWeight: 'bold'}} title="Giới hạn 70 ký tự/tin"><i className="fa-solid fa-triangle-exclamation"></i> Có dấu (Unicode)</span>
                                            ) : (
                                                <span title="Giới hạn 160 ký tự/tin">Không dấu (GSM)</span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div className="form-actions">
                        <button onClick={handleSave} className="btn-save"><i className="fa-solid fa-floppy-disk me-1"></i> Lưu lại</button>
                        <button onClick={goToList} className="btn-back"><i className="fa-solid fa-rotate-left me-1"></i> Quay lại</button>
                    </div>
                </div>
              </div>
            );
          };

          return (
            <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
                {/* --- Top Navbar --- */}
                <div className="d-flex justify-content-between align-items-center top-nav">
                    <div className="d-flex align-items-center flex-wrap w-100 overflow-hidden" style={{overflow: 'visible !important'}}>
                        <a href="index.html" className="logo-text me-3 flex-shrink-0">
                            <i className="fa-solid fa-wifi fa-rotate-90 me-1" style={{fontSize: '18px'}}></i>VTC<span style={{color: '#00a0e3'}}>Pay</span>
                        </a>
                        
                        <div className="ms-md-3 nav-menu-container d-flex align-items-center">
                            <a href="index.html" className="nav-btn me-1 text-decoration-none">
                                <i className="fa-solid fa-money-bill me-2"></i> Duyệt tiền công
                            </a>
                            
                            <div className="dropdown nav-dropdown d-inline-block me-1">
                                <button className="nav-btn dropdown-toggle" type="button" id="transactionDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i className="fa-solid fa-money-check-dollar me-2"></i> Giao dịch
                                </button>
                                <ul className="dropdown-menu" aria-labelledby="transactionDropdown">
                                    <li><a className="dropdown-item" href="chi_ho.html"><i className="fa-solid fa-money-bill-transfer me-2 text-success"></i> Chuyển tiền chi hộ</a></li>
                                </ul>
                            </div>

                            <div className="dropdown nav-dropdown d-inline-block me-1">
                                <button className="nav-btn dropdown-toggle" type="button" id="reportDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i className="fa-solid fa-chart-pie me-2"></i> Báo cáo
                                </button>
                                <ul className="dropdown-menu" aria-labelledby="reportDropdown">
                                    <li><a className="dropdown-item" href="index.html"><i className="fa-solid fa-chart-bar me-2 text-primary"></i>Tổng hợp Merchant</a></li>
                                </ul>
                            </div>

                            <div className="dropdown nav-dropdown d-inline-block">
                                <button className="nav-btn active-tab dropdown-toggle" type="button" id="systemDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i className="fa-solid fa-gear me-2"></i> Hệ thống
                                </button>
                                <ul className="dropdown-menu dropdown-menu-end" aria-labelledby="systemDropdown">
                                    <li><a className="dropdown-item active" href="SMS.html"><i className="fa-solid fa-comment-sms me-2 text-primary"></i> Quản lý SMS</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <div className="d-flex align-items-center user-info-container ms-3">
                        <span className="user-info me-2"><i className="fa-solid fa-circle-user me-1"></i> hongtt</span>
                        <a href="#" className="logout-btn" title="Đăng xuất"><i className="fa-solid fa-right-from-bracket"></i></a>
                    </div>
                </div>

                {/* --- Main Content --- */}
                <div style={{ flex: 1, backgroundColor: '#fff' }}>
                    <div className="page-title-bar shadow-sm">
                        <i className="fa-solid fa-comment-sms me-2"></i> QUẢN LÝ CẤU HÌNH MẪU SMS
                    </div>

                    <div className="nav-tabs-custom">
                        <button onClick={goToList} className={`tab-btn ${view === 'list' ? 'active' : ''}`}><i className="fa-solid fa-list"></i> DANH SÁCH</button>
                        <button onClick={() => view === 'form' ? null : goToCreate()} className={`tab-btn ${view === 'form' ? 'active' : ''}`}><i className="fa-solid fa-database"></i> DỮ LIỆU</button>
                    </div>

                    <div>
                        {view === 'list' ? renderList() : renderForm()}
                    </div>
                </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
