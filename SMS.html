<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý cấu hình mẫu SMS</title>
    
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tải React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Tải Babel để biên dịch JSX trực tiếp trên trình duyệt -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #f1f2f7; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- BỘ ICON (Thay thế Lucide React để file chạy độc lập) ---
        const IconSearch = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const IconPlus = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconEdit = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
        const IconTrash = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const IconSave = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconChevronLeft = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
        const IconChevronDown = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
        const IconSettings = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const IconFileText = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
        const IconAlertCircle = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const IconMessageSquare = ({size=16, className=""}) => <svg width={size} height={size} className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>;

        // --- MOCK DATA & CONSTANTS ---
        const INITIAL_DATA = [
          { id: 112, name: '[VTC Pay] Mã xác thực OTP đăng ký', event: ['OTP_REGISTER'], status: 'Active', updatedBy: 'linhtt3', content: 'Ma xac thuc cua ban tai {BRANDNAME} la {OTP_CODE}. Vui long khong cung cap ma nay cho bat ky ai.' },
          { id: 152, name: '[VTC Pay] Cảnh báo biến động số dư', event: ['BALANCE_CHANGE'], status: 'Active', updatedBy: 'tuanhd', content: 'Tai khoan {ACCOUNT_NAME} vua phat sinh giao dich {AMOUNT} VND vao luc {TIME}. Kiem tra tai app VTC Pay.' },
          { id: 1524, name: '[VTC] Thông báo nhận quà khuyến mãi', event: ['PROMO_GIFT'], status: 'Inactive', updatedBy: 'nhatnd', content: 'Chuc mung {ACCOUNT_NAME} da nhan duoc qua tang tu {BRANDNAME}.' },
        ];

        const INITIAL_SMS_EVENTS = [
          { value: 'OTP_REGISTER', label: 'OTP Đăng ký/Đăng nhập' },
          { value: 'OTP_TRANSACTION', label: 'OTP Xác thực giao dịch' },
          { value: 'BALANCE_CHANGE', label: 'Biến động số dư' },
          { value: 'PROMO_GIFT', label: 'Thông báo Khuyến mãi' },
          { value: 'CSKH', label: 'Chăm sóc khách hàng' },
        ];

        const VARIABLES = [
          { tag: '{BRANDNAME}', name: 'Brandname', maxLength: 11, desc: 'Tên định danh (Tối đa 11 ký tự)' },
          { tag: '{OTP_CODE}', name: 'Mã OTP', maxLength: 6, desc: 'Mã xác thực (6 ký tự)' },
          { tag: '{ACCOUNT_NAME}', name: 'Tên tài khoản', maxLength: 25, desc: 'Tên khách hàng (Giả định max 25 ký tự)' },
          { tag: '{AMOUNT}', name: 'Số tiền', maxLength: 15, desc: 'Số tiền giao dịch (VD: 10,000,000)' },
          { tag: '{TIME}', name: 'Thời gian', maxLength: 19, desc: 'Định dạng DD/MM/YYYY HH:mm' },
        ];

        // --- HELPER FUNCTION: Tính toán độ dài tin nhắn an toàn (Safe Margin) ---
        const calculateSmsStats = (text) => {
          let processedText = text;
          
          VARIABLES.forEach(v => {
            const safePlaceholder = 'X'.repeat(v.maxLength);
            processedText = processedText.split(v.tag).join(safePlaceholder);
          });

          const isUnicode = /[^\u0000-\u00ff]/.test(processedText);
          const length = processedText.length;

          let maxSingle = isUnicode ? 70 : 160;
          let maxMulti = isUnicode ? 67 : 153;
          let parts = 0;

          if (length > 0) {
            if (length <= maxSingle) {
              parts = 1;
            } else {
              parts = Math.ceil(length / maxMulti);
            }
          }

          return { length, parts, isUnicode };
        };

        // --- COMPONENT CHÍNH ---
        function App() {
          const [view, setView] = useState('list');
          const [data, setData] = useState(INITIAL_DATA);
          const [smsEvents, setSmsEvents] = useState(INITIAL_SMS_EVENTS);
          const [formData, setFormData] = useState({});
          const [newEventName, setNewEventName] = useState('');
          const textAreaRef = useRef(null);

          const [searchTerm, setSearchTerm] = useState('');
          const [statusFilter, setStatusFilter] = useState('All');

          const goToList = () => setView('list');
          const goToCreate = () => {
            setFormData({ status: 'Active', event: [], content: '' });
            setView('form');
          };
          const goToEdit = (item) => {
            setFormData({ ...item });
            setView('form');
          };

          const handleSave = () => {
            if (!formData.name || !formData.content) {
              alert("Vui lòng điền các trường bắt buộc (*)");
              return;
            }
            
            if (formData.id) {
              setData(data.map(item => item.id === formData.id ? { ...formData, updatedBy: 'admin_current' } : item));
            } else {
              const newId = Math.floor(Math.random() * 100000);
              setData([{ ...formData, id: newId, updatedBy: 'admin_current' }, ...data]);
            }
            goToList();
          };

          const handleAddEvent = (e) => {
            e.preventDefault();
            if (!newEventName.trim()) return;
            
            const newValue = newEventName.trim().toUpperCase()
              .replace(/Đ/g, 'D')
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/\s+/g, '_')
              .replace(/[^A-Z0-9_]/g, '');

            if (smsEvents.find(ev => ev.value === newValue)) {
               alert('Nghiệp vụ này đã tồn tại!');
               return;
            }

            const finalValue = newValue || `EVENT_${Date.now()}`;
            const newEvent = { value: finalValue, label: newEventName.trim() };
            
            setSmsEvents([...smsEvents, newEvent]);
            
            const currentEvents = formData.event || [];
            setFormData({...formData, event: [...currentEvents, finalValue]});
            setNewEventName('');
          };

          const insertVariable = (tag) => {
            const text = formData.content || '';
            const cursorPosition = textAreaRef.current?.selectionStart || text.length;
            
            const textBefore = text.substring(0, cursorPosition);
            const textAfter = text.substring(cursorPosition);
            
            const newContent = textBefore + tag + textAfter;
            setFormData({ ...formData, content: newContent });
            
            setTimeout(() => {
              if (textAreaRef.current) {
                textAreaRef.current.focus();
                const newPos = cursorPosition + tag.length;
                textAreaRef.current.setSelectionRange(newPos, newPos);
              }
            }, 0);
          };

          const renderList = () => {
            const filteredData = data.filter(item => {
              const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  item.content.toLowerCase().includes(searchTerm.toLowerCase());
              const matchStatus = statusFilter === 'All' || item.status === statusFilter;
              return matchSearch && matchStatus;
            });

            return (
              <div className="bg-white border border-gray-300 rounded shadow-sm">
                <div className="p-4 border-b border-gray-200 bg-gray-50 flex flex-wrap gap-4 items-center justify-between">
                  <div className="flex gap-4 items-center">
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-medium text-gray-700">Trạng thái</span>
                      <select 
                        className="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500"
                        value={statusFilter}
                        onChange={(e) => setStatusFilter(e.target.value)}
                      >
                        <option value="All">-- Tất cả --</option>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                      </select>
                    </div>
                    
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-medium text-gray-700">Từ khóa</span>
                      <input 
                        type="text" 
                        placeholder="Nhập tên, nội dung mẫu..." 
                        className="border border-gray-300 rounded px-3 py-1.5 text-sm w-64 focus:outline-none focus:border-blue-500"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                      />
                    </div>
                    
                    <button className="bg-[#5bc0de] hover:bg-[#46b8da] text-white px-4 py-1.5 rounded flex items-center gap-2 text-sm">
                      <IconSearch /> Tra Cứu
                    </button>
                  </div>
                  
                  <button 
                    onClick={goToCreate}
                    className="bg-[#5cb85c] hover:bg-[#4cae4c] text-white px-4 py-1.5 rounded flex items-center gap-2 text-sm font-medium"
                  >
                    <IconPlus /> Thêm mới
                  </button>
                </div>

                <div className="p-3 flex justify-between items-center border-b border-gray-200">
                  <div className="flex gap-2">
                    <button className="border border-gray-300 bg-white text-gray-700 px-3 py-1 text-sm rounded flex items-center gap-1 hover:bg-gray-50">
                      <IconFileText size={14} /> Hiện 25 dòng
                    </button>
                    <button className="border border-gray-300 bg-white text-gray-700 px-3 py-1 text-sm rounded flex items-center gap-1 hover:bg-gray-50">
                      Ẩn/hiện cột
                    </button>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-sm text-gray-600">Tìm kiếm:</span>
                    <input type="text" className="border border-gray-300 rounded px-2 py-1 text-sm w-48" />
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-sm text-left">
                    <thead className="bg-[#e8f1f9] text-gray-700">
                      <tr>
                        <th className="px-4 py-2 border border-gray-200 font-bold text-center w-16">STT</th>
                        <th className="px-4 py-2 border border-gray-200 font-bold w-24">ID</th>
                        <th className="px-4 py-2 border border-gray-200 font-bold">Tên mẫu SMS</th>
                        <th className="px-4 py-2 border border-gray-200 font-bold">SMS Event</th>
                        <th className="px-4 py-2 border border-gray-200 font-bold text-center">Trạng thái</th>
                        <th className="px-4 py-2 border border-gray-200 font-bold">Người Cập Nhật</th>
                        <th className="px-4 py-2 border border-gray-200 font-bold text-center w-24">Chức Năng</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredData.map((item, index) => (
                        <tr key={item.id} className="hover:bg-gray-50 border-b border-gray-200">
                          <td className="px-4 py-2 border-r border-gray-200 text-center">{index + 1}</td>
                          <td className="px-4 py-2 border-r border-gray-200">{item.id}</td>
                          <td className="px-4 py-2 border-r border-gray-200 font-medium text-blue-600 cursor-pointer hover:underline" onClick={() => goToEdit(item)}>
                            {item.name}
                          </td>
                          <td className="px-4 py-2 border-r border-gray-200">
                            {(item.event || []).map(eVal => smsEvents.find(e => e.value === eVal)?.label || eVal).join(', ')}
                          </td>
                          <td className="px-4 py-2 border-r border-gray-200 text-center">
                            <span className={`px-2 py-0.5 rounded text-xs text-white ${item.status === 'Active' ? 'bg-green-500' : 'bg-gray-400'}`}>
                              {item.status}
                            </span>
                          </td>
                          <td className="px-4 py-2 border-r border-gray-200">{item.updatedBy}</td>
                          <td className="px-4 py-2 flex justify-center gap-1">
                            <button onClick={() => goToEdit(item)} className="bg-[#f0ad4e] hover:bg-[#ec971f] text-white p-1 rounded" title="Sửa">
                              <IconEdit size={14} />
                            </button>
                            <button className="bg-[#d9534f] hover:bg-[#c9302c] text-white p-1 rounded" title="Xóa">
                              <IconTrash size={14} />
                            </button>
                          </td>
                        </tr>
                      ))}
                      {filteredData.length === 0 && (
                        <tr>
                          <td colSpan="7" className="px-4 py-8 text-center text-gray-500">Không tìm thấy dữ liệu.</td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

                <div className="p-3 bg-gray-50 flex justify-between items-center text-sm text-gray-600 border-t border-gray-200">
                  <div>Hiển thị từ 1 tới {filteredData.length} của {filteredData.length} bản ghi</div>
                  <div className="flex border border-gray-300 rounded overflow-hidden">
                    <button className="px-3 py-1 bg-white hover:bg-gray-100 border-r border-gray-300">Trước</button>
                    <button className="px-3 py-1 bg-[#337ab7] text-white">1</button>
                    <button className="px-3 py-1 bg-white hover:bg-gray-100 border-l border-gray-300">Tiếp</button>
                  </div>
                </div>
              </div>
            );
          };

          const renderForm = () => {
            const smsStats = calculateSmsStats(formData.content || '');

            return (
              <div className="bg-white border border-gray-300 rounded shadow-sm">
                <div className="bg-[#f2dede] text-[#a94442] px-4 py-3 text-sm flex items-center gap-2 border-b border-[#ebccd1]">
                  <span className="bg-[#d9534f] text-white px-1.5 py-0.5 text-xs font-bold rounded">Chú ý!</span>
                  Hãy chắc chắn nhập vào đầy đủ thông tin tại các mục bắt buộc đánh dấu (*)
                </div>

                <div className="bg-[#337ab7] text-white px-4 py-2 font-medium flex items-center gap-2">
                  <IconSettings /> {formData.id ? 'Cập nhật mẫu SMS' : 'Thêm mới mẫu SMS'}
                </div>

                <div className="p-6">
                  <div className="grid grid-cols-[150px_1fr] gap-4 mb-4 items-center">
                    <label className="text-right text-sm font-bold text-[#333] tracking-wide">
                      Tên mẫu SMS<span className="text-red-500 ml-1">*</span>
                    </label>
                    <input 
                      type="text" 
                      className="border border-gray-300 rounded px-3 py-1.5 w-full focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm"
                      value={formData.name || ''}
                      onChange={(e) => setFormData({...formData, name: e.target.value})}
                      placeholder="VD: Nhắc nhở thanh toán hóa đơn..."
                    />
                  </div>

                  <div className="grid grid-cols-[150px_1fr] gap-4 mb-4 items-center">
                    <label className="text-right text-sm font-bold text-[#333] tracking-wide">
                      SMS Event
                    </label>
                    <div className="flex flex-col gap-2 border border-gray-300 rounded px-3 py-2 bg-white">
                      <div className="flex flex-wrap gap-4 items-center">
                        {smsEvents.map(ev => (
                          <label key={ev.value} className="flex items-center gap-1.5 cursor-pointer text-sm">
                            <input 
                              type="checkbox"
                              checked={(formData.event || []).includes(ev.value)}
                              onChange={(e) => {
                                const currentEvents = formData.event || [];
                                if (e.target.checked) {
                                  setFormData({...formData, event: [...currentEvents, ev.value]});
                                } else {
                                  setFormData({...formData, event: currentEvents.filter(val => val !== ev.value)});
                                }
                              }}
                              className="cursor-pointer w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                            />
                            {ev.label}
                          </label>
                        ))}
                      </div>
                      <div className="flex items-center gap-2 mt-1 pt-2 border-t border-gray-100">
                        <input
                          type="text"
                          placeholder="Nhập tên nghiệp vụ mới..."
                          className="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 w-64"
                          value={newEventName}
                          onChange={e => setNewEventName(e.target.value)}
                          onKeyDown={e => {
                            if (e.key === 'Enter') {
                              e.preventDefault();
                              handleAddEvent(e);
                            }
                          }}
                        />
                        <button
                          onClick={handleAddEvent}
                          className="bg-[#5cb85c] hover:bg-[#4cae4c] text-white px-3 py-1 rounded text-sm flex items-center gap-1 transition-colors"
                        >
                          <IconPlus size={14} /> Thêm nghiệp vụ
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-[150px_1fr] gap-4 mb-4 items-center">
                    <label className="text-right text-sm font-bold text-[#333] tracking-wide">
                      Trạng thái
                    </label>
                    <select 
                      className="border border-gray-300 rounded px-3 py-1.5 w-32 focus:outline-none focus:border-blue-500 text-sm"
                      value={formData.status || 'Active'}
                      onChange={(e) => setFormData({...formData, status: e.target.value})}
                    >
                      <option value="Active">Active</option>
                      <option value="Inactive">Inactive</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-[150px_1fr] gap-4 mb-4 items-start">
                    <div className="text-right mt-2">
                      <label className="text-sm font-bold text-[#333] tracking-wide block">
                        Nội dung SMS<span className="text-red-500 ml-1">*</span>
                      </label>
                    </div>
                    
                    <div className="border border-gray-300 rounded p-1 bg-white">
                      <div className="bg-[#f5f5f5] border-b border-gray-300 p-2 flex flex-wrap gap-2 items-center rounded-t">
                        <span className="text-xs font-bold text-gray-600 mr-2 flex items-center gap-1">
                          <IconPlus size={12} /> Chèn biến:
                        </span>
                        {VARIABLES.map(v => (
                          <button 
                            key={v.tag}
                            onClick={(e) => { e.preventDefault(); insertVariable(v.tag); }}
                            className="bg-white border border-gray-300 hover:bg-blue-50 hover:border-blue-300 text-blue-700 text-xs px-2 py-1 rounded transition-colors"
                            title={v.desc}
                          >
                            {v.tag}
                          </button>
                        ))}
                      </div>

                      <textarea 
                        ref={textAreaRef}
                        className="w-full h-40 p-3 focus:outline-none focus:bg-[#ffffe0] resize-y text-sm font-mono text-gray-800"
                        value={formData.content || ''}
                        onChange={(e) => setFormData({...formData, content: e.target.value})}
                        placeholder="Nhập nội dung tin nhắn dạng chữ thuần túy (Plain text)..."
                      ></textarea>
                      
                      <div className="bg-[#f9f9f9] border-t border-gray-200 p-2 flex justify-between items-center rounded-b text-xs">
                        <div className="flex gap-4">
                          <span className="text-gray-600">
                            Ký tự (Bao gồm độ dài max của biến): <strong className={smsStats.length > 0 ? "text-blue-600" : ""}>{smsStats.length}</strong>
                          </span>
                          <span className="text-gray-600">
                            Số tin nhắn dự kiến (Max): <strong className={smsStats.parts > 1 ? "text-red-600" : "text-green-600"}>{smsStats.parts}</strong>
                          </span>
                        </div>
                        <div className="flex gap-2 items-center">
                          {smsStats.isUnicode ? (
                             <span className="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded border border-yellow-200 flex items-center gap-1" title="Giới hạn 70 ký tự/tin">
                               <IconAlertCircle size={12}/> Có dấu (Unicode)
                             </span>
                          ) : (
                            <span className="bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200" title="Giới hạn 160 ký tự/tin">
                              Không dấu (GSM)
                            </span>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>

                </div>

                <div className="bg-[#f5f5f5] px-6 py-4 border-t border-gray-200 flex justify-center gap-3">
                  <button 
                    onClick={handleSave}
                    className="bg-[#337ab7] hover:bg-[#286090] text-white px-5 py-1.5 rounded flex items-center gap-2 text-sm font-medium shadow-sm transition-colors"
                  >
                    <IconSave /> Lưu lại
                  </button>
                  <button 
                    onClick={goToList}
                    className="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-5 py-1.5 rounded flex items-center gap-2 text-sm font-medium transition-colors"
                  >
                    <IconChevronLeft /> Quay lại
                  </button>
                </div>
              </div>
            );
          };

          return (
            <div className="w-full min-h-screen bg-[#f1f2f7] font-sans flex flex-col">
              
              {/* Header */}
              <header className="bg-white border-b border-gray-200 shadow-sm px-4 py-2 flex items-center gap-4">
                <div className="text-[#337ab7] font-black text-2xl italic tracking-tighter mr-4">
                  VTC<span className="text-red-500 font-medium">pay</span>
                </div>
                <div className="flex text-sm text-gray-600 font-bold gap-2">
                   <button className="bg-[#337ab7] text-white px-3 py-1.5 rounded flex items-center gap-1">
                     <IconSettings size={14}/> Hệ thống <IconChevronDown size={14} />
                   </button>
                </div>
              </header>

              {/* Nội dung chính */}
              <main className="p-4 mx-auto w-full flex-grow" style={{ maxWidth: '1400px' }}>
                
                <div className="bg-[#337ab7] text-white px-4 py-2.5 rounded-t font-medium text-sm flex items-center gap-2 uppercase">
                   <IconMessageSquare /> Hệ thống &gt; Quản lý SMS &gt; Quản lý cấu hình mẫu SMS
                </div>
                
                <div className="bg-white border-x border-gray-300 px-4 pt-2">
                  <div className="flex gap-1 border-b border-gray-200 pb-[1px]">
                    <button 
                      onClick={goToList}
                      className={`px-4 py-2 text-sm font-bold flex items-center gap-2 rounded-t ${view === 'list' ? 'bg-[#337ab7] text-white' : 'bg-[#e7e7e7] text-gray-600 hover:bg-gray-200'}`}
                    >
                      <IconFileText /> DANH SÁCH
                    </button>
                    <button 
                      onClick={() => view === 'form' ? null : goToCreate()}
                      className={`px-4 py-2 text-sm font-bold flex items-center gap-2 rounded-t ${view === 'form' ? 'bg-[#337ab7] text-white' : 'bg-[#e7e7e7] text-gray-600 hover:bg-gray-200'}`}
                    >
                      <IconSettings /> DỮ LIỆU
                    </button>
                  </div>
                </div>

                <div className="bg-white border-x border-b border-gray-300 p-4 rounded-b">
                  {view === 'list' ? renderList() : renderForm()}
                </div>

              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
